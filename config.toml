# The URL the site will be built for
base_url = "https://bitdevslima.org"

title = "BITDEVSLIM"
description = "BITDEVSLIM es una comunidad en Lima para quienes desean discutir y participar en la investigación y el desarrollo de Bitcoin, así como de protocolos y software relacionados."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Configuration of the Markdown rendering
[markdown]

[extra]
# Put all your custom variables here

github = "https://github.com/bitdevsLIM/bitdevsLIM"
meetup = "https://lu.ma"
discord = ""
